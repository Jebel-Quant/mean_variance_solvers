# Shared environment for the experiment/ study.
#
# The figure/table scripts depend on nothing beyond nncg (the matrix-free
# active-set NNQP method under study) and the local baselines.py comparison
# solvers over cvx.linalg operators — fast_minimum_variance is no longer used.
# Each script still carries its own PEP 723 header, so `uv run <script>.py`
# keeps working standalone; this file collects the union of those headers'
# dependencies into one project so `make venv` (i.e. `uv sync`) can build a
# single persistent .venv for interactive work, editing, IDEs, and `make test`.
#
# This is not a distributable package (package = false below); it exists only
# to pin the environment the scripts run in.

[project]
name = "mean-variance-experiments"
version = "0.0.0"
description = "Figure and table generation for the mean-variance / RMT / NNCG papers"
requires-python = ">=3.11"
dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
    "pyarrow",
    "scikit-learn",
    # solver stack: nncg (method under study) + baselines.py comparison solvers
    # Pinned to a commit rather than a release: GlobalNystrom (used by
    # experiment_nncg_precond.py) landed on main after the v0.5.0 tag was cut.
    # Swap this back to a plain version pin once a release includes it.
    "nncg",
    "cvx-linalg",
    "clarabel",
    "osqp",
    "scipy",
    # CVXPY reference solver (ground-truth; measures modeling-layer overhead)
    "cvxpy",
    # cvx-quadprog: the dual active-set solver the quadprog note derives. Its
    # experiments verify that note's identities against the running code, so
    # the version matters -- see quadprog_note/ and the paper's Section 10.
    "cvx-quadprog>=0.4.1",
    # fetch_sp500.py / fetch_ftse100.py (raw data download)
    "yfinance",
    "lxml",
    "requests",
]

[tool.uv]
package = false

[tool.uv.sources]
nncg = { git = "https://github.com/Jebel-Quant/nncg", rev = "52346e12b4ec9f18f4ad497827867bbbaefccec9" }

[dependency-groups]
dev = ["pytest", "pytest-cov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: end-to-end experiment runs (deselect with '-m \"not slow\"')",
]

# Coverage is measured on the reusable solver LIBRARY — the pieces the unit
# tests exercise directly and where correctness lives. The experiment_*.py
# figure/table scripts are integration-tested instead (the smoke suite runs
# every one end-to-end and asserts it exits 0 and writes its outputs), and the
# fetch_*.py network downloaders are out of scope; both are omitted here.
[tool.coverage.run]
source = ["common", "cg", "nncg_note"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "common/fetch_*.py",
    "*/experiment*.py",
]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
