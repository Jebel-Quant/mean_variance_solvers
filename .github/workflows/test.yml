name: Test

# Runs the experiment/ test suite on every push and pull request: the unit
# tests for the solver library (baselines, cg, nncg problems, shrinkage,
# timing helpers) plus end-to-end smoke runs of every figure/table script,
# driven by `make test`. The scripts run in smoke mode against the committed
# data/*.parquet, so no network, LaTeX toolchain, or external data is needed --
# only the uv-managed project environment (experiment/pyproject.toml).

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg  # headless matplotlib: render figures without a display
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run test suite
        run: make test
