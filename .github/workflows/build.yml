name: Build and publish PDF

# The quality gate (make check) runs on every push and pull request; the
# publish and release steps below stay guarded to main / tags via their own
# `if:` conditions, so broadening the triggers does not change what ships.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      # Runs before checkout: needs no repo files, and a cache hit restores
      # the TeX Live packages without going through apt at all.
      - name: Install TeX Live (cached)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: >-
            texlive-latex-base
            texlive-latex-recommended
            texlive-latex-extra
            texlive-fonts-recommended
            texlive-science
            texlive-publishers
          version: 1.0
          # TeX Live relies on postinst scripts (fmtutil, mktexlsr) to build
          # format files; rerun them when restoring from cache.
          execute_install_scripts: true

      # The postinst scripts alone leave a restored cache with an empty ls-R
      # and stale font maps (pdfTeX then falls back to bitmap fonts and fails
      # with "auto expansion is only possible with scalable fonts").
      - name: Refresh TeX Live databases
        run: |
          sudo mktexlsr
          sudo updmap-sys
          sudo fmtutil-sys --byfmt pdflatex

      - name: Checkout
        uses: actions/checkout@v4

      # Cheap compile-time and static checks (issue #28): undefined refs and
      # citations, spaced dash asides, bib placeholders, stale solver rows.
      # Fails the build before anything is published.
      - name: Quality gate
        run: make check

      - name: Compile every paper
        run: make compile

      # Collects out/<DOC>.pdf for every paper, by asking each paper's own
      # Makefile to stage the document its DOC names -- so a new paper folder is
      # published by existing in, and nothing here enumerates papers.
      #
      # This replaces three `cp`s written out by name. Under those, quadprog/
      # compiled and passed the gate but was never published, and the run stayed
      # green because a list that is missing an entry cannot fail.
      #
      # Unconditional, and before the release step, so that a tag has the PDFs
      # on disk to attach and a broken `stage` surfaces on pull requests rather
      # than first on main. `names` feeds the publish commit message below.
      - name: Collect the compiled PDFs
        id: pdfs
        run: |
          make pdfs
          names=$(cd out && ls *.pdf \
            | sed 's/_paper\.pdf$//; s/\.pdf$//' \
            | sort \
            | tr '\n' ',' \
            | sed 's/,$//; s/,/, /g')
          echo "names=$names" >> "$GITHUB_OUTPUT"
          echo "Staged $(ls out/*.pdf | wc -l | tr -d ' ') PDFs: $names"

      # Build the arXiv source tarballs after `make compile` -- compile ends
      # with `make clean`, which removes the tarballs, so this must run later.
      # It leaves out/*.pdf alone, adding out/arxiv/ beside them.
      - name: Build arXiv source tarballs
        if: startsWith(github.ref, 'refs/tags/')
        run: make arxiv

      # Globs rather than names, for the same reason as the step above: the
      # release assets are whatever the papers produced. This list going stale
      # is the failure mode that only bites at the next tag, which is the worst
      # kind to leave to a hardcoded list.
      - name: Attach PDFs and arXiv source to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.pdf
            out/arxiv/*.tar.gz

      - name: Publish to pdf
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: pdf
          publish_dir: ./out
          keep_files: true
          commit_message: "Publish compiled PDFs (${{ steps.pdfs.outputs.names }}) from ${{ github.sha }}"
